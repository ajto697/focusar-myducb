<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>FocusAR Guardian Status</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #10b981;
      border-radius: 6px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
    }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #10b981;
      color: #020617;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"></div>
    <div class="title">FocusAR Guardian MV3</div>
  </div>

  <div class="status-card">
    <div class="status-item">
      <span>Trạng Thái Sync:</span>
      <span class="badge">Hoạt Động</span>
    </div>
    <div class="status-item">
      <span>Tab Detection:</span>
      <span>Tự Động Active</span>
    </div>
  </div>

  <a href="http://localhost:3000/focus" target="_blank" class="btn">Mở Phiên 2 Phút Ngay</a>

  <script src="popup.js"></script>
</body>
</html>
